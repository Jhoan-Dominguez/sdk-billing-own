# Uso: cp .env.example .env  (y cambia las contraseñas)  →  docker compose up -d --build
#   App:      http://localhost:${APP_PORT}
#   Keycloak: http://localhost:${KEYCLOAK_PORT}  (consola admin con KEYCLOAK_ADMIN_*)
#   pgAdmin:  http://localhost:${PGADMIN_PORT}
#   Mailpit:  http://localhost:${MAILPIT_PORT}  (correos que envían la app y Keycloak)

# Variables comunes de la app web y del worker (mismo código, mismo .env).
x-app-env: &app-env
  POSTGRES_USER: ${POSTGRES_USER:-billing}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-billing}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  BILLING_PERSISTENCE: ${BILLING_PERSISTENCE:-sql}
  AUTH_REDIRECT_URI: http://localhost:${APP_PORT:-8502}/oauth2callback
  KEYCLOAK_CLIENT_ID: billing-app
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_URL: http://localhost:${KEYCLOAK_PORT:-8180}
  KEYCLOAK_ADMIN_API_SECRET: ${KEYCLOAK_ADMIN_API_SECRET}
  BILLING_SECRET_KEY: ${BILLING_SECRET_KEY:?define BILLING_SECRET_KEY en .env}
  BILLING_CURRENCY: ${BILLING_CURRENCY:-USD}
  # Correo saliente (confirmaciones de seguridad).
  BILLING_MAILER: ${BILLING_MAILER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM: ${SMTP_FROM:-no-reply@billing.example.com}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  SMTP_SSL: ${SMTP_SSL:-false}
  # Agentes LLM (ver docs/servicios/agentes.md).
  BILLING_LLM_PROVIDER: ${BILLING_LLM_PROVIDER:-}
  BILLING_LLM_MODEL: ${BILLING_LLM_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
  # Buzones IMAP de notificaciones bancarias.
  BILLING_MAIL_SYNC_INTERVAL: ${BILLING_MAIL_SYNC_INTERVAL:-120}
  BILLING_FORECAST_ALGORITHM: ${BILLING_FORECAST_ALGORITHM:-lightgbm}
  BILLING_FORECAST_INTERVAL: ${BILLING_FORECAST_INTERVAL:-3600}
  BILLING_FORECAST_GLOBAL_INTERVAL: ${BILLING_FORECAST_GLOBAL_INTERVAL:-86400}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-billing}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    # Imagen propia: Keycloak 26.8 + tema de login + realm (infra/docker/keycloak/Dockerfile).
    # Tras cambiar el tema o el README: docker compose up -d --build keycloak
    build:
      context: .
      dockerfile: infra/docker/keycloak/Dockerfile
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-billing}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-kcadmin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?define KEYCLOAK_ADMIN_PASSWORD en .env}
      # El navegador usa localhost:KEYCLOAK_PORT; la app habla con keycloak:8080 dentro
      # de la red de Docker. BACKCHANNEL_DYNAMIC hace que el token/jwks se sirvan con
      # el host interno sin cambiar el issuer de los tokens.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Variables usadas por realm-billing.json al importarlo (solo la primera vez).
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?define KEYCLOAK_CLIENT_SECRET en .env}
      KEYCLOAK_ADMIN_API_SECRET: ${KEYCLOAK_ADMIN_API_SECRET:?define KEYCLOAK_ADMIN_API_SECRET en .env}
      BILLING_ADMIN_PASSWORD: ${BILLING_ADMIN_PASSWORD:?define BILLING_ADMIN_PASSWORD en .env}
      BILLING_CUSTOMER_PASSWORD: ${BILLING_CUSTOMER_PASSWORD:?define BILLING_CUSTOMER_PASSWORD en .env}
      APP_PORT: ${APP_PORT:-8502}
      # Servidor SMTP para verificar correos y recuperar contraseñas (realm smtpServer).
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@billing.example.com}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # La imagen no trae curl: se consulta el puerto de gestión con /dev/tcp de bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:?define AUTH_COOKIE_SECRET en .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Ollama corriendo en el host
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "${APP_PORT:-8502}:8501"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # Sincroniza los buzones IMAP de notificaciones bancarias (python -m billing.worker).
  worker:
    build:
      context: .
      dockerfile: infra/docker/app/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "billing.worker"]
    environment:
      <<: *app-env
      BILLING_SKIP_SECRETS: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy  # la app aplica las migraciones al arrancar
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib, sys, time; sys.exit(time.time() - pathlib.Path('/tmp/worker-alive').stat().st_mtime > 600)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@billing.example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?define PGADMIN_PASSWORD en .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

  # Correo saliente de desarrollo: captura todo lo que envían la app y Keycloak
  # (no llega a Internet) y lo muestra en http://localhost:${MAILPIT_PORT}.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "2000"
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"  # para la app corriendo en local (make dev)

  # Bandeja de entrada de desarrollo (SMTP + IMAP) para las notificaciones bancarias:
  # scripts/send_bank_samples.py envía correos a su SMTP y el worker los lee por IMAP,
  # igual que con Gmail u Outlook. Los buzones se crean con GREENMAIL_USERS.
  greenmail:
    image: greenmail/standalone:2.1.3
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users.login=email
        -Dgreenmail.users=${GREENMAIL_USERS:-cliente:Bandeja-Compras-2026@billing.example.com,maria.lopez:Bandeja-Compras-2026@billing.example.com}
    ports:
      - "${GREENMAIL_SMTP_PORT:-3025}:3025"
      - "${GREENMAIL_IMAP_PORT:-3143}:3143"

volumes:
  db_data:
  uploads:
  pgadmin_data:
