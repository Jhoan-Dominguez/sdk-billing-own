# la derecha. Hereda de `base` (HTML sin estilos) y aplica solo css/compras.css.
parent=base
import=common/keycloak
locales=es

styles=css/compras.css
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=cp-html
kcBodyClass=cp-body

kcFormClass=cp-form
kcFormGroupClass=cp-field
kcContentWrapperClass=cp-row
kcLabelWrapperClass=cp-label-row
kcLabelClass=cp-label
kcInputWrapperClass=cp-input-wrap
kcInputClass=cp-input
kcInputGroup=cp-input-group
