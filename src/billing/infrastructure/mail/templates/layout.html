<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$subject</title>
<!-- Mismo diseño que los correos de Keycloak (infra/docker/keycloak/themes/compras/email/html/template.ftl). -->
</head>
<body style="margin:0;padding:0;background:#f4f6f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#213547;">
<div style="padding:32px 16px;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #dde3ea;border-radius:12px;overflow:hidden;">
    <div style="background:#42b883;color:#ffffff;padding:18px 28px;font-size:18px;font-weight:700;">Registro de compras</div>
    <div style="padding:28px;font-size:15px;line-height:1.6;">
      <h1 style="font-size:20px;margin:0 0 16px;">$title</h1>
      $body
    </div>
  </div>
  <p style="max-width:560px;margin:16px auto 0;color:#5b6b78;font-size:12px;text-align:center;">$footer</p>
</div>
</body>
</html>
