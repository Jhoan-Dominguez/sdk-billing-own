# Instalar los hooks una vez: .venv/bin/pre-commit install
# Pasarlos a todo el repo:    .venv/bin/pre-commit run --all-files
# Actualizar versiones:       .venv/bin/pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  # Ruff reemplaza a black (ruff-format), isort (regla I) y flake8.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
