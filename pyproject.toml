[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "compras"
version = "0.1.0"
description = "Registro de compras mensuales con importación de facturas"
requires-python = ">=3.13"
# Dependencias de ejecución (las instala también la imagen Docker).
dependencies = [
    "streamlit[pdf,auth]>=1.50",
    "pandas>=2.2",
    "pillow>=11",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
    "anthropic>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=4", "ruff>=0.17"]

[project.scripts]
compras = "compras.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Archivos que no son .py pero viajan con el paquete (migraciones, estilos).
"*" = ["*.mako", "*.css"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["data"]

[tool.ruff.lint]
# E/W: pycodestyle · F: pyflakes · I: isort · UP: pyupgrade · B: bugbear · SIM: simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["compras"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
