# Migraciones del esquema. La URL de la base sale de compras.settings (no se repite aquí).
#   .venv/bin/alembic upgrade head
#   .venv/bin/alembic revision -m "descripcion"     (y escribir upgrade/downgrade a mano)
# La app aplica las pendientes al arrancar (compras.bootstrap.init_database).
[alembic]
script_location = %(here)s/src/compras/infrastructure/persistence/sqlalchemy/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
